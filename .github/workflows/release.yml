name: Release Obsidian plugin

# 推送形如 0.1.1 的 tag 时触发：构建 → 生成构建溯源证明(attestation) → 创建 Release 并上传三件套。
# Release 名自动带上版本号(= tag)，同时补齐 review 提示的 artifact attestations。
on:
  push:
    tags:
      - '*'

permissions:
  contents: write        # 创建 Release / 上传资产
  id-token: write        # attestation 需要
  attestations: write    # 写入构建溯源证明

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}   # Release 名 = tag(含版本号)
          files: |
            main.js
            manifest.json
            styles.css
